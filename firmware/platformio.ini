[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<diagnostics/>

[env:p2-sampling-diagnostic]
build_src_filter =
    +<sampling.cpp>
    +<sensors/>
    +<diagnostics/p2_sampling_diagnostic.cpp>
