[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<diagnostics/>

# Standalone P3 hardware diagnostic. It uses P2's public sampling API but does
# not replace P1's setup()/loop() or enable MQTT/backend code.
[env:p3-fan-vibration-diagnostic]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
    +<sampling.cpp>
    +<sensors/>
    +<features.cpp>
    +<fft_processor.cpp>
    +<classifier.cpp>
    +<diagnostics/p3_fan_vibration_diagnostic.cpp>
